services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: serveproof
      POSTGRES_PASSWORD: serveproof
      POSTGRES_DB: serveproof
    ports:
      # host 5433 — a non-ServeProof Postgres already occupies localhost:5432 on this machine
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serveproof"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
